    <div class="submit-container">
      <h1 class="text-center mb-1"><i class="bi bi-upload"></i> Submit Your Album</h1>
       <!-- Submit Album Logo Section -->
    <div class="container-fluid text-center d-flex align-items-center justify-content-center;">
      <img src="Images/logo/idh transparent album.png" alt="IDH Submit Album Logo">
    </div>
      <div class="success-message" id="successMessage">
        <i class="bi bi-check-circle"></i> Album submitted successfully!
      </div>
      
      <div class="error-message" id="errorMessage">
        <i class="bi bi-exclamation-triangle"></i> <span id="errorText"></span>
      </div>

      <form id="album-form">
        <div class="mb-3">
          <label for="artist_name" class="form-label">Artist Name *</label>
          <input type="text" class="form-control" id="artist_name" placeholder="Enter artist name" required>
        </div>

        <div class="mb-3">
          <label for="album_title" class="form-label">Album Title *</label>
          <input type="text" class="form-control" id="album_title" placeholder="Enter album title" required>
        </div>

        <div class="mb-3">
          <label for="album_image" class="form-label">Album Artwork *</label>
          <input type="file" class="form-control" id="album_image" accept="image/*" required>
          <div id="imagePreview"></div>
        </div>

        <div class="mb-3">
          <label for="release_date" class="form-label">Release Date</label>
          <input type="date" class="form-control" id="release_date">
        </div>

        <div class="mb-3">
          <label for="genre" class="form-label">Genre</label>
          <input type="text" class="form-control" id="genre" placeholder="e.g., Deep House, Soulful House">
        </div>

        <div class="mb-3">
          <label for="buy_link" class="form-label">Buy/Stream Link *</label>
          <input type="url" class="form-control" id="buy_link" placeholder="https://..." required>
          <small class="text-muted">Link to Beatport, Traxsource, Spotify, etc.</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Social Media Links</label>
          
          <div class="social-link-group">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-spotify"></i></span>
              <input type="url" class="form-control" id="spotify_link" placeholder="Spotify URL">
            </div>
          </div>

          <div class="social-link-group">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-soundwave"></i></span>
              <input type="url" class="form-control" id="soundcloud_link" placeholder="SoundCloud URL">
            </div>
          </div>

          <div class="social-link-group">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-youtube"></i></span>
              <input type="url" class="form-control" id="youtube_link" placeholder="YouTube URL">
            </div>
          </div>

          <div class="social-link-group">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-instagram"></i></span>
              <input type="url" class="form-control" id="instagram_link" placeholder="Instagram URL">
            </div>
          </div>

          <div class="social-link-group">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-facebook"></i></span>
              <input type="url" class="form-control" id="facebook_link" placeholder="Facebook URL">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Album Description</label>
          <textarea class="form-control" id="description" rows="4" placeholder="Tell us about this album..."></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
            <span id="submitText">Submit Album</span>
            <span class="spinner-border spinner-border-sm" id="submitSpinner" role="status" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Handling Script -->
    <script>
      // Sign in anonymously on page load
      let authReady = false;
      
      firebase.auth().signInAnonymously()
        .then(() => {
          console.log('Signed in anonymously');
          authReady = true;
        })
        .catch((error) => {
          console.error('Anonymous sign-in failed:', error);
          const errorMessage = document.getElementById('errorMessage');
          errorMessage.style.display = 'block';
          document.getElementById('errorText').textContent = 'Authentication failed: ' + error.message;
        });

      // Wait for auth state before allowing submissions
      firebase.auth().onAuthStateChanged(function(user) {
        const submitBtn = document.getElementById('submitBtn');
        if (user) {
          console.log('User authenticated:', user.uid);
          submitBtn.disabled = false;
          authReady = true;
        } else {
          console.log('No user signed in');
          submitBtn.disabled = true;
          authReady = false;
        }
      });

      // Image preview
      document.getElementById('album_image').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `<img src="${e.target.result}" class="preview-image" alt="Album artwork preview">`;
          };
          reader.readAsDataURL(file);
        }
      });

      // Form submission
      document.getElementById('album-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Check if user is authenticated
        if (!authReady || !firebase.auth().currentUser) {
          const errorMessage = document.getElementById('errorMessage');
          errorMessage.style.display = 'block';
          document.getElementById('errorText').textContent = 'Please wait for authentication to complete.';
          return;
        }
        
        // Show loading state
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        
        submitText.style.display = 'none';
        submitSpinner.style.display = 'inline-block';
        submitBtn.disabled = true;
        successMessage.style.display = 'none';
        errorMessage.style.display = 'none';

        // Get form values
        const artistName = document.getElementById('artist_name').value.trim();
        const albumTitle = document.getElementById('album_title').value.trim();
        const buyLink = document.getElementById('buy_link').value.trim();
        const releaseDate = document.getElementById('release_date').value;
        const genre = document.getElementById('genre').value.trim();
        const description = document.getElementById('description').value.trim();
        const imageFile = document.getElementById('album_image').files[0];

        // Collect social media links
        const socialLinks = {};
        const spotifyLink = document.getElementById('spotify_link').value.trim();
        const soundcloudLink = document.getElementById('soundcloud_link').value.trim();
        const youtubeLink = document.getElementById('youtube_link').value.trim();
        const instagramLink = document.getElementById('instagram_link').value.trim();
        const facebookLink = document.getElementById('facebook_link').value.trim();

        if (spotifyLink) socialLinks.spotify = spotifyLink;
        if (soundcloudLink) socialLinks.soundcloud = soundcloudLink;
        if (youtubeLink) socialLinks.youtube = youtubeLink;
        if (instagramLink) socialLinks.instagram = instagramLink;
        if (facebookLink) socialLinks.facebook = facebookLink;

        // Upload image to Firebase Storage
        const timestamp = Date.now();
        const fileName = `${timestamp}_${imageFile.name}`;
        const storageRef = storage.ref('album_artworks/' + fileName);
        
        storageRef.put(imageFile)
          .then(function(snapshot) {
            return snapshot.ref.getDownloadURL();
          })
          .then(function(imageURL) {
            // Store album data in Firebase Realtime Database
            const albumData = {
              artist_name: artistName,
              album_title: albumTitle,
              image_url: imageURL,
              buy_link: buyLink,
              release_date: releaseDate || null,
              genre: genre || null,
              description: description || null,
              social_links: socialLinks,
              submitted_at: timestamp,
              approved: false // Set to false by default, you can manually approve in Firebase
            };

            const albumRef = database.ref('albums').push();
            return albumRef.set(albumData);
          })
          .then(function() {
            // Success
            submitText.style.display = 'inline';
            submitSpinner.style.display = 'none';
            submitBtn.disabled = false;
            successMessage.style.display = 'block';
            
            // Reset form
            document.getElementById('album-form').reset();
            document.getElementById('imagePreview').innerHTML = '';
            
            // Scroll to success message
            successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Hide success message after 5 seconds
            setTimeout(() => {
              successMessage.style.display = 'none';
            }, 5000);
          })
          .catch(function(error) {
            // Error
            console.error('Error submitting album:', error);
            submitText.style.display = 'inline';
            submitSpinner.style.display = 'none';
            submitBtn.disabled = false;
            
            errorMessage.style.display = 'block';
            document.getElementById('errorText').textContent = 'Error submitting album: ' + error.message;
            
            // Scroll to error message
            errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
      });
    </script>
