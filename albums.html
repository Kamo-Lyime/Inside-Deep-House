    <div class="albums-container">
      <div class="container">
        <h1 class="text-center mb-4"><i class="bi bi-vinyl"></i> Album Collection</h1>
         <!-- Submit Album Logo Section -->
    <div class="container-fluid text-center d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(255,255,255,0.1) 100%); padding: 40px 0; margin-top: 76px; min-height: 50vh;">
      <img src="Images/logo/idh submit album logo.png" alt="IDH Submit Album Logo" style="max-height: 250px; width: auto; margin-bottom: 50px;">
    </div>
        <div class="filter-section">
          <div class="search-box">
            <input type="text" class="form-control" id="searchInput" placeholder="Search by artist, album, or genre...">
          </div>
          <div class="text-center">
            <button class="btn btn-sm btn-outline-light me-2" onclick="filterByGenre('all')">All</button>
            <button class="btn btn-sm btn-outline-light me-2" onclick="filterByGenre('Deep House')">Deep House</button>
            <button class="btn btn-sm btn-outline-light me-2" onclick="filterByGenre('Soulful House')">Soulful House</button>
            <button class="btn btn-sm btn-outline-light me-2" onclick="filterByGenre('Afro House')">Afro House</button>
          </div>

        <div class="loading" id="loading">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p>Loading albums...</p>
        </div>

        <div class="no-albums" id="noAlbums" style="display: none;">
          <i class="bi bi-vinyl" style="font-size: 5rem; color: #666;"></i>
          <h3>No albums found</h3>
          <p>Be the first to submit an album!</p>
          <a href="submit-album.html" class="btn btn-primary">Submit Album</a>
        </div>

        <div class="row" id="albums-container">
          <!-- Albums will be loaded here dynamically -->
        </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Albums Display Script -->
    <script>
      let allAlbums = [];
      let currentFilter = 'all';

      // Load albums from Firebase
      function loadAlbums() {
        const albumsRef = database.ref('albums');
        
        albumsRef.on('value', function(snapshot) {
          const albums = snapshot.val();
          const loading = document.getElementById('loading');
          const noAlbums = document.getElementById('noAlbums');
          const albumsContainer = document.getElementById('albums-container');
          
          loading.style.display = 'none';
          
          if (!albums) {
            noAlbums.style.display = 'block';
            albumsContainer.innerHTML = '';
            return;
          }

          // Convert to array and show all albums
          allAlbums = Object.keys(albums)
            .map(id => ({ id, ...albums[id] }))
            // .filter(album => album.approved !== false) // Uncomment to only show approved albums
            .sort((a, b) => b.submitted_at - a.submitted_at); // Sort by newest first

          if (allAlbums.length === 0) {
            noAlbums.style.display = 'block';
            albumsContainer.innerHTML = '';
          } else {
            noAlbums.style.display = 'none';
            displayAlbums(allAlbums);
          }
        });
      }

      // Display albums in the DOM
      function displayAlbums(albums) {
        const albumsContainer = document.getElementById('albums-container');
        albumsContainer.innerHTML = '';

        albums.forEach(album => {
          const albumCard = createAlbumCard(album);
          albumsContainer.appendChild(albumCard);
        });
      }

      // Create album card element
      function createAlbumCard(album) {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';

        const releaseDate = album.release_date ? 
          `<div class="release-date"><i class="bi bi-calendar3"></i> ${new Date(album.release_date).toLocaleDateString()}</div>` : '';

        const genre = album.genre ? 
          `<span class="album-genre"><i class="bi bi-music-note"></i> ${album.genre}</span><br>` : '';

        const description = album.description ? 
          `<div class="album-description">${album.description}</div>` : '';

        // Build social links
        let socialLinksHtml = '';
        if (album.social_links && Object.keys(album.social_links).length > 0) {
          socialLinksHtml = '<div class="social-links">';
          
          if (album.social_links.spotify) {
            socialLinksHtml += `<a href="${album.social_links.spotify}" target="_blank" title="Spotify"><i class="bi bi-spotify"></i></a>`;
          }
          if (album.social_links.soundcloud) {
            socialLinksHtml += `<a href="${album.social_links.soundcloud}" target="_blank" title="SoundCloud"><i class="bi bi-soundwave"></i></a>`;
          }
          if (album.social_links.youtube) {
            socialLinksHtml += `<a href="${album.social_links.youtube}" target="_blank" title="YouTube"><i class="bi bi-youtube"></i></a>`;
          }
          if (album.social_links.instagram) {
            socialLinksHtml += `<a href="${album.social_links.instagram}" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>`;
          }
          if (album.social_links.facebook) {
            socialLinksHtml += `<a href="${album.social_links.facebook}" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>`;
          }
          
          socialLinksHtml += '</div>';
        }

        col.innerHTML = `
          <div class="album-card">
            <img src="${album.image_url}" alt="${album.album_title}" class="album-image">
            <div class="album-details">
              <div class="album-title">${album.album_title}</div>
              <div class="album-artist">${album.artist_name}</div>
              ${releaseDate}
              ${genre}
              ${description}
              ${socialLinksHtml}
              <a href="${album.buy_link}" target="_blank" class="buy-button">
                <i class="bi bi-cart3"></i> Buy / Stream
              </a>
            </div>
          </div>
        `;

        return col;
      }

      // Filter by genre
      function filterByGenre(genre) {
        currentFilter = genre;
        
        if (genre === 'all') {
          displayAlbums(allAlbums);
        } else {
          const filtered = allAlbums.filter(album => 
            album.genre && album.genre.toLowerCase().includes(genre.toLowerCase())
          );
          displayAlbums(filtered);
        }
      }

      // Search functionality
      document.getElementById('searchInput').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        
        const filtered = allAlbums.filter(album => {
          const artistMatch = album.artist_name.toLowerCase().includes(searchTerm);
          const titleMatch = album.album_title.toLowerCase().includes(searchTerm);
          const genreMatch = album.genre && album.genre.toLowerCase().includes(searchTerm);
          
          return artistMatch || titleMatch || genreMatch;
        });

        displayAlbums(filtered);
      });

      // Load albums when page loads
      window.addEventListener('load', loadAlbums);
    </script>
